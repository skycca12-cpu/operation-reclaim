    .panel { position: absolute; right: 3.6%; bottom: 6%; width: min(560px, 40vw); min-width: 280px; padding: 14px 18px 16px; background: linear-gradient(90deg, rgba(10,4,7,.0), rgba(10,4,7,.86) 18%); text-align: left; }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
    #loading-status { margin: 0 0 10px; color: #fff; font-size: clamp(16px, 1.9vw, 26px); font-weight: 700; text-shadow: 0 2px 3px #000; }
    .row { display: flex; align-items: center; gap: 14px; }
    progress { flex: 1; height: clamp(14px, 1.8vw, 24px); border: 2px solid #e8333a; border-radius: 3px; overflow: hidden; appearance: none; background: #2a0c10; accent-color: #e8333a; }
    progress::-webkit-progress-bar { background: #2a0c10; }
    progress::-webkit-progress-value { background: linear-gradient(#ff8a8a, #e8333a 45%, #b3141c); }
    progress::-moz-progress-bar { background: #e8333a; }
    #loading-pct { min-width: 3.4em; color: #fff; font-size: clamp(20px, 2.6vw, 38px); font-weight: 800; text-align: right; text-shadow: 0 2px 3px #000; }
    #loading-notice { max-width: 420px; margin: 10px 0 0; color: #e7d8de; line-height: 1.5; font-size: 14px; }
    #loading-retry { margin-top: 10px; min-height: 44px; padding: 0 22px; border: 2px solid #e8333a; border-radius: 3px; background: #3b0b10; color: #fff; font: inherit; cursor: pointer; }
    #loading-retry:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) { progress:indeterminate { animation: breathe 1.2s ease-in-out infinite alternate; } @keyframes breathe { from { opacity: .55; } to { opacity: 1; } } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">이 게임은 JavaScript 지원 브라우저가 필요합니다.</canvas>
  <section id="loading" role="status" aria-live="polite">
    <h1 id="game-title">OPERATION: RECLAIM — 수도 탈환 작전</h1>
    <div class="panel">
      <p id="loading-status">작전 준비 중...</p>
      <div class="row"><progress id="loading-progress" aria-label="게임 다운로드 진행률"></progress><span id="loading-pct">0%</span></div>
      <p id="loading-notice" hidden></p>
      <button id="loading-retry" type="button" hidden>다시 시도</button>
    </div>
    <noscript>게임을 실행하려면 JavaScript가 필요합니다.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      const pct = document.getElementById('loading-pct');
      // keyboard focus for WASD: clicking anywhere focuses the game canvas
      canvas.addEventListener('pointerdown', () => canvas.focus());
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        notice.textContent = performance.now() - lastProgressAt >= 30000
          ? '새로운 로딩 진행이 보이지 않습니다. 계속 기다리거나 다시 시도할 수 있습니다.'
          : '게임을 불러오는 중입니다. 계속 기다리거나 다시 시도할 수 있습니다.';
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = '게임을 불러오지 못했습니다. 연결을 확인한 뒤 다시 시도해 주세요.';
        progress.hidden = true;
        pct.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = '작전 지역을 준비하고 있습니다…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        pct.textContent = `${Math.floor(Math.min(current, total) / total * 100)}%`;
        status.textContent = current >= total ? '작전 개시 준비 완료' : '작전 준비 중... 데이터 수신';
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
